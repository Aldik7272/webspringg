<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Запись к врачу — линика</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #eef2f3; color: #333; }
        h1 { color: #009432; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #009432; color: white; }
        input, select, button { padding: 10px; margin: 5px 0; border-radius: 4px; border: 1px solid #ccc; width: 100%; max-width: 400px; display: block; }
        button { background: #009432; color: white; border: none; cursor: pointer; width: auto; }
        button:hover { background: #10ac84; }
        .del-btn { background: #ee5253; padding: 5px 10px; width: auto; }
        .edit-btn { background: #ff9f43; padding: 5px 10px; width: auto; margin-right: 5px; }
    </style>
</head>
<body>

    <h1>Медицинская клиника — Запись на прием</h1>

    <div class="card">
        <h3 id="formTitle">Записаться к врачу</h3>
        <input type="hidden" id="appId">
        <label>ФИО пациента:</label>
        <input type="text" id="patientName" placeholder="ванов ван">
        
        <label>Номер телефона:</label>
        <input type="text" id="phone" placeholder="+7 (700) 000-00-00">
        
        <label>Выберите врача:</label>
        <select id="doctorName">
            <option value="Dr. Smith (Терапевт)">Терапевт</option>
            <option value="Dr. House (иагност)">Стоматолог</option>
            <option value="Dr. Watson (ардиолог)">Кардиолог</option>
            <option value="Dr. Grey (Хирург)">Хирург</option>
        </select>
        
        <br>
        <button id="saveBtn" onclick="saveAppointment()">Записать</button>
        <button id="cancelBtn" onclick="resetForm()" style="background: #888; display: none;">Отмена</button>
    </div>

    <div class="card">
        <h3>Список записей</h3>
        <button onclick="loadAppointments()">Обновить список</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Пациент</th>
                    <th>Телефон</th>
                    <th>Врач</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const API_URL = '/api/appointments';
        window.onload = loadAppointments;

        async function loadAppointments() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(a => {
                tbody.innerHTML += `
                    <tr>
                        <td>${a.id}</td>
                        <td>${a.patientName}</td>
                        <td>${a.phone}</td>
                        <td>${a.doctorName}</td>
                        <td>
                            <button class="edit-btn" onclick="startEdit(${a.id}, '${a.patientName}', '${a.phone}', '${a.doctorName}')">Изменить</button>
                            <button class="del-btn" onclick="deleteAppointment(${a.id})">Удалить</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function saveAppointment() {
            const id = document.getElementById('appId').value;
            const item = {
                patientName: document.getElementById('patientName').value,
                phone: document.getElementById('phone').value,
                doctorName: document.getElementById('doctorName').value
            };

            if (id) {
                await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(item)
                });
            } else {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(item)
                });
            }

            resetForm();
            loadAppointments();
        }

        function startEdit(id, patientName, phone, doctorName) {
            document.getElementById('appId').value = id;
            document.getElementById('patientName').value = patientName;
            document.getElementById('phone').value = phone;
            document.getElementById('doctorName').value = doctorName;

            document.getElementById('formTitle').innerText = 'Редактировать запись (ID: ' + id + ')';
            document.getElementById('saveBtn').innerText = 'Сохранить';
            document.getElementById('cancelBtn').style.display = 'inline-block';
        }

        function resetForm() {
            document.getElementById('appId').value = '';
            document.getElementById('patientName').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('formTitle').innerText = 'Записаться к врачу';
            document.getElementById('saveBtn').innerText = 'Записать';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        async function deleteAppointment(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            loadAppointments();
        }
    </script>
</body>
</html>
